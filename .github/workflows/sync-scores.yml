name: Sync NHL scores

on:
  schedule:
    # All times UTC. Runs a few times through the evening window when most
    # NHL games finish (roughly 6pm-1am Eastern = 23:00-06:00 UTC), plus one
    # daytime run to catch matinees. Adjust freely — this is cheap to run
    # more often since GitHub Actions cron on a public repo is free.
    - cron: "30 23 * * *" # ~6:30pm ET
    - cron: "30 1 * * *" # ~8:30pm ET
    - cron: "30 3 * * *" # ~10:30pm ET
    - cron: "30 5 * * *" # ~12:30am ET (late West Coast games)
    - cron: "0 16 * * *" # midday catch-up / catches matinees
  workflow_dispatch: {} # lets you trigger a sync manually from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npx prisma generate

      - run: npm run sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
