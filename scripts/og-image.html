<style>
  * { box-sizing: border-box; margin: 0; }

  .chip { flex: 1; background: #142a3f; border: 1px solid #26415a; border-radius: 14px;
          padding: 20px 22px; }
  .chip .n { font-family: "Barlow Condensed", sans-serif; font-weight: 700;
             font-size: 62px; line-height: 1; color: #57b8b0; }
  .chip .n.zero { color: #7f95a8; }
  .chip .l { margin-top: 8px; font-size: 21px; font-weight: 500; color: #a9bccd;
             letter-spacing: 0.02em; }
